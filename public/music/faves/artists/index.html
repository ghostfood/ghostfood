    function buildTable(rows) {
        if ($.fn.DataTable.isDataTable(tableSelector)) {
            const dt = $(tableSelector).DataTable();
            dt.clear();
            dt.rows.add(rows);
            dt.draw();
            return;
        }

        $(tableSelector).DataTable({
            "dom": '<flip<t>ip>',
            "deferRender": true,
            "data": rows,

                    title: 'Photo',
                    data: 'image',

                        const imageSrc = (!data || data === '__' || data === '___' || String(data).trim() === '') ? placeholderImage : data;
                        const artistName = String(row && row.artist ? row.artist : 'Artist photo').replace(/"/g, '&quot;');
                        return '<img src="' + imageSrc + '" class="rounded brsm artist-thumb" alt="' + artistName + '" style="width:100%; min-width:100px; height:auto; display:block;">';
                    }
                },
                { title: 'Score', data: 'score' },

                { title: 'Top track(s) #2', data: 'track2' },

                { title: 'Releasing since', data: 'releasingSince' },
                { title: 'Origins', data: 'origins' },
                { title: 'Associations', data: 'associations' },
                { title: 'Notes', data: 'notes' }
            ],
            order: [[2, 'desc']],
            iDisplayLength: 25,
            aLengthMenu: [
                [25, 50, 100, -1],
                [25, 50, 100, 'All']
            ]
