<script type="text/javascript">
  /* Formatting function for row details - modify as you need */
function format ( d ) {
    // `d` is the original data object for the row
    return '<div class="d-flex width-100 pos-rel">'+
        '<div class="row-media" style="background-image:url('+d.mediaimg+')"></div>'+
        '<div class="medialinks"><h5>'+d.mediatype+'</h5>'+
        '<iframe width="560" height="315" src="'+d.medialink+'" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>'+
    '</div></div>';
}

$(document).ready(function() {
    var table = $('#faves7019').DataTable( {
        "dom": '<flip<t>ip>',
        "ajax": "data/music-faves.txt",
        "columns": [
            { "data": "pos" },
            { "data": "title" },
            { "data": "artist" },
            { "data": "year" },
            { "data": "yearpos" },
            { "data": "ukpos" },
            { "data": "appears" },
            { "data": "decade" },
            { "data": "also" },
            { "data": "notes" },
            { "data": "latest" },
            {
                "className":      'details-control',
                "orderable":      false,
                "data":           null,
                "defaultContent": ''

            }
        ],
        "order": [[0, 'asc']],
        "iDisplayLength": 25,
        aLengthMenu: [
            [25, 50, 100, -1],
            [25, 50, 100, "All"]
        ]
    } );

    // Add event listener for opening and closing details
    $('#faves7019 tbody').on('click', 'td.details-control', function () {
        var tr = $(this).closest('tr');
        var row = table.row( tr );
 
        if ( row.child.isShown() ) {
            // This row is already open - close it
            row.child.hide();
            tr.removeClass('shown');
        }
        else {
            // Open this row
            row.child( format(row.data()) ).show();
            tr.addClass('shown');

        }
    } );
    // Handle click on "Expand All" button
    $('#btn-show-all-children').on('click', function(){
        // Enumerate all rows
        table.rows().every(function(){
            // If row has details collapsed
            if(!this.child.isShown()){
                // Open this row
                this.child(format(this.data())).show();
                $(this.node()).addClass('shown');
            }
        });
    });

    // Handle click on "Collapse All" button
    $('#btn-hide-all-children').on('click', function(){
        // Enumerate all rows
        table.rows().every(function(){
            // If row has details expanded
            if(this.child.isShown()){
                // Collapse row details
                this.child.hide();
                $(this.node()).removeClass('shown');
            }
        });
    });
    
} );
</script>
