body{margin:0}
#grid{position:relative;width:2048px;height:1024px;background:#fff;border:3px solid #333;margin:3px;overflow:hidden}


#gridsquares>div{position:absolute;width:32px;height:32px;box-sizing:border-box;border:1px solid transparent;z-index:4;}

#top-grad {
    position: absolute;
    height: 1024px;
    width: 1600px;
    overflow: hidden;
    background: linear-gradient(90deg, black 50%, transparent 70%);
    z-index: 1;
    left: 0;

}
#under-grad {
    position: absolute;
    height: 2048px;
    width: 2048px;
    overflow: hidden;
    background: linear-gradient(0deg, black 30%, transparent 60%);
    z-index: 4;
    left: 0;
    transform: rotate(45deg);
    opacity: .25;

}
#square-one {
	position:absolute;
	height:2048px;
	width:2048px;
	overflow:hidden;
	border-radius:5rem;
	background:rgba(200, 0, 110,.5);
	filter:saturate(1.5);
	z-index:2;
	transform:rotate(45deg);
	left:-1024px;
}
#square-two {
	position:absolute;
	height:1024px;
	width:1024px;
	overflow:hidden;
	border-radius:5rem;
	background:rgba(200, 0, 110, 0.5);
	filter:saturate(1.5);
	z-index:3;
	transform:rotate(45deg);
	left:-300px;
	
}
#video-image {
	position:relative !important;
	width:2048px;
	height:1024px;

}
#video-image::before {
    background: url('https://i.ytimg.com/vi/6U-9bCtSpx8/hq720.jpg');
    background-repeat: no-repeat;
    background-size: 110%;
    background-position: -180% 50%;
    position: absolute;
    display: block;
    content: '';
    height: 100%;
    width: 100%;
    filter: saturate(1.75);
}
#video-image::after {
	    position: absolute;
    display: block;
    content: '';
    height: 100%;
    width: 100%;
    filter: blur(10px);
    background-color:rgba(100,0,50,.25);
    opacity:.5;
}
.official-videos {
    position: absolute !important;
    bottom: 64px;
    left: 32px;
    height: 96px !important;
    width: 990px !important;
    font-size: 124px;
    line-height: 96px;
    z-index: 5;
    color:white;
    letter-spacing: 28px;
}
